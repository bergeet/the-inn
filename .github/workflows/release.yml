# Push a version tag (git tag v0.4.3 && git push origin v0.4.3) to publish a
# GitHub Release with the addon zip. The tag must match "## Version:" in
# TheInn/TheInn.toc. Every push and pull request runs the tests.
name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job can write, and only for tags.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install LuaJIT (WoW runs Lua 5.1)
        run: sudo apt-get update -q && sudo apt-get install -y -q luajit zip
      - name: Run the tests (simulated Forever and Classic Era clients)
        run: luajit tests/run.lua
      - name: Build the zip
        run: scripts/package.sh

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install LuaJIT and zip
        run: sudo apt-get update -q && sudo apt-get install -y -q luajit zip
      - name: Build the zip
        run: scripts/package.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^## Version: *//p' TheInn/TheInn.toc | tr -d '\r')
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match the TOC version $version" >&2
            exit 1
          fi
          # Release notes: this version's entry from the changelog in TheInn/README.md
          awk -v v="**$version**" '$0 == v {on = 1; next} on && /^\*\*[0-9]/ {exit} on && /^## / {exit} on' \
            TheInn/README.md > notes.md
          printf '\nInstall: unzip into `Interface/AddOns` (you should get a `TheInn` folder), then restart WoW.\n' >> notes.md
          gh release create "$TAG" "dist/TheInn-$version.zip" --title "The Inn $version" --notes-file notes.md
